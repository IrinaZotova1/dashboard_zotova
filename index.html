<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Театр Сегодня — Дашборд</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles/main.css">
<link rel="stylesheet" href="styles/components.css">
</head>
<body>

<div class="app">
  <header class="header">
    <div>
      <h1>Театр Сегодня</h1>
      <div class="header-sub"><span class="live-dot" aria-hidden="true"></span> Live · обновлено только что</div>
    </div>
  </header>

  <div class="toolbar" id="toolbar" role="toolbar" aria-label="Добавление виджетов">
    <button class="toolbar-btn" type="button" data-add="todo">+ ToDo</button>
    <button class="toolbar-btn" type="button" data-add="quote">+ Цитата</button>
    <button class="toolbar-btn" type="button" data-add="top-spectacles">+ Топ спектаклей</button>
    <button class="toolbar-btn" type="button" data-add="play-of-day">+ Пьеса дня</button>
    <button class="toolbar-btn" type="button" data-add="legend">+ Легенда дня</button>
    <button class="toolbar-btn" type="button" data-add="history">+ История театра</button>
    <button class="toolbar-btn" type="button" data-add="top5">+ Топ-5</button>
  </div>

  <div class="grid" id="dashboard" aria-live="polite"></div>
</div>

<script type="module" src="main.js"></script>
</body>
</html>
